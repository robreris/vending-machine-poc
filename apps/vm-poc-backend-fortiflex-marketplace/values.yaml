
name: vm-poc-backend-fortiflex-marketplace
serviceAccount:
  create: true
  name: vm-poc-backend-fortiflex-marketplace
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::228122752878:role/fortiflex-marketplace-bedrock
image:
  tag: latest
replicas: 1

# /data is a ReadWriteOnce EBS volume holding the SQLite user DB. Under the
# default RollingUpdate the new pod starts while the old one still holds the
# volume; if it schedules to a different node it can't attach and the rollout
# stalls (Multi-Attach error). Recreate stops the old pod first - costs a few
# seconds of downtime per restart.
strategy:
  type: Recreate

# Default 500m/512Mi (shared chart) OOMKilled twice on 2026-09-22 while
# processing a large EA Excel upload. Raised to give ea_conversions.py
# headroom for large-file pandas processing.
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 2Gi

# Backend Dockerfile runs as uid/gid 1000 (non-root). The /data PVC below was
# created under the previous root-running container - fsGroup makes the
# volume group-writable to 1000 on mount so the SQLite DB stays accessible
# instead of failing with Permission Denied.
podSecurityContext:
  runAsNonRoot: true
  fsGroup: 1000

containerPort: 8000
servicePort: 8000
ingressPort: 8000

env:
  DEBUG: "false"
  AWS_REGION: "us-east-1"
  MSSP_SECRET_NAME: "fortiflex-marketplace/mssp-master"
  DB_PATH: "/data/marketplace.db"
  # EA session artifacts + small app state on the PVC so restarts don't wipe
  # in-progress sessions. The app sweeps sessions idle > TTL and refuses new
  # uploads below EA_MIN_FREE_MB free, so they can't fill the volume the
  # SQLite user DB lives on.
  EA_SESSION_DIR: "/data/ea-sessions"
  APP_PERSIST_DIR: "/data/app"
  # Runtime-edited catalog/parameters/spec files/presets. The PVC copy wins;
  # the image copy only seeds an empty dir (a git catalog change must be
  # re-imported via the UI). Export: GET /api/parameters/export.
  APP_CONFIG_DIR: "/data/app/config"
  EA_SESSION_TTL_HOURS: "72"
  EA_MIN_FREE_MB: "300"
  FORTIAIGATE_BASE_URL: "https://fortiaigate.fortinetcloudcse.com/v1/responses"
  FORTIAIGATE_MODEL: "gpt-4o-mini"

envFromSecret: fortiflex-marketplace-fortiaigate

persistence:
  mountPath: /data
  storageClass: gp2-csi
  # 1Gi -> 5Gi (2026-09-23) for persisted EA sessions (~15 MB per large EA).
  size: 5Gi

# /healthz answers from the event loop; heavy EA work runs in threads. Generous
# timeout/threshold so a long upload can't get the pod killed.
healthCheck:
  enabled: true
  path: /healthz
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 6

ingress:
  enabled: true
  host: fortiflex-marketplace-api.fortinetcloudcse.com
  certificateArn: arn:aws:acm:us-east-1:228122752878:certificate/194f3eec-f018-47aa-be72-fec0868d16f0
  annotations:
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=300
