replicas: 1
ingressPort: 80
ECRregistry: 228122752878.dkr.ecr.us-east-1.amazonaws.com
serviceAccount:
  create: false
  name: ""
  annotations: {}

# Pod-level security context, applied to every app via the shared chart.
# runAsUser/runAsGroup must be numeric, not the image's USER name (e.g.
# "appuser"/"node") - without it, the kubelet can't verify a named user
# resolves to non-root without running the container, and refuses to start
# it at all ("cannot verify user is non-root"). 1000 matches every app's
# Dockerfile except vm-poc-frontend-fortiflex (nginx, uid 101 - overridden
# in its own values.yaml). Override per-app (e.g. set runAsNonRoot: false)
# only for an image that is not yet built to run non-root - see each app's
# Dockerfile.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

# Container-level security context, applied to every app via the shared chart.
containerSecurityContext:
  allowPrivilegeEscalation: false

# Default compute footprint; override per-app in its own values.yaml if a
# service needs more (or less).
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Opt-in HTTP liveness/readiness probes. Disabled by default because not
# every app exposes the same health path - set healthCheck.enabled: true
# and healthCheck.path in an app's own values.yaml once its health
# endpoint is confirmed (repo convention is /healthz or /api/whoami).
healthCheck:
  enabled: false
  path: /healthz
  initialDelaySeconds: 5
  periodSeconds: 10

# Baseline NetworkPolicy, applied to every app via the shared chart, to contain lateral
# movement in the shared `default` namespace (every pod there can otherwise reach every
# other pod). Default-deny ingress except two allowed sources:
#
#   1. vpcCIDR - the ALB (target-type: ip) sends traffic straight to the pod IP from its own
#      ENIs, and kubelet sends liveness/readiness probes from the node's IP - neither is a
#      cluster pod, so neither can be expressed as a podSelector/namespaceSelector on the
#      aws-load-balancer-controller. Both source IPs fall inside the cluster VPC CIDR (see
#      arch/event-poc-cluster.yaml vpc.cidr), so this is expressed as an ipBlock instead, and
#      only added for an app when it actually needs it (ingress.enabled or healthCheck.enabled).
#   2. allowFrom - same-namespace peers (by `app` label value) that call this service
#      directly pod-to-pod, e.g. vm-poc-frontend -> vm-poc-backend-greeting. Populate per-app
#      in that app's own values.yaml; empty here.
#
# Egress is left unrestricted (egressEnabled: false) - restricting it would mean enumerating
# every external API each app calls (FortiFlex, FortiAIGate, DynamoDB, Secrets Manager, Azure
# AD SAML, ...), which is a bigger, separate change with more risk of breaking something than
# this baseline is worth. Leaving egress open also means this policy can't accidentally block
# DNS (kube-dns/coredns) - egress is simply not restricted, so no DNS carve-out is needed.
# Opt out per-app with networkPolicy.enabled: false if a service genuinely needs it.
networkPolicy:
  enabled: true
  vpcCIDR: "10.0.0.0/16"
  allowFrom: []
  egressEnabled: false
