name: vm-poc-frontend-fortiflex
image:
  tag: latest
replicas: 1

# nginx:alpine's built-in nginx user is uid/gid 101, not the chart default
# of 1000 - override so the numeric runAsUser actually matches this image.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101

servicePort: 80
containerPort: 8080

healthCheck:
  enabled: true
  path: /

env:
  FORTIFLEX_BACKEND_URL: "http://vm-poc-backend-fortiflex:5000"

ingress:
  enabled: true
  host: fortiflex.fortinetcloudcse.com
  certificateArn: arn:aws:acm:us-east-1:228122752878:certificate/194f3eec-f018-47aa-be72-fec0868d16f0
