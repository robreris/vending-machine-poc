apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: vending-machine-poc
  region: us-east-1
  version: "1.34"  # Supported EKS control plane at the time of writing

vpc:
  cidr: 10.0.0.0/16

availabilityZones:
- us-east-1a
- us-east-1b

managedNodeGroups:
  - name: vm-group
    instanceType: t3.large
    desiredCapacity: 1
    minSize: 1
    maxSize: 2
    volumeSize: 20
    privateNetworking: true
    labels:
      role: app
    iam:
      withAddonPolicies:
        efs: true
        cloudWatch: true
        autoScaler: true

cloudWatch:
  clusterLogging:
    enableTypes: ["api", "audit", "authenticator", "controllerManager", "scheduler"]

# Container logs -> CloudWatch (added 2026-09-23). Without this, pod logs only
# lived on the pod and every deploy/restart destroyed them. Fluent Bit ships
# every container's stdout to /aws/containerinsights/vending-machine-poc/application
# (30-day retention, set on the log groups). Live cluster: IRSA role
# vmpoc-cloudwatch-observability (CloudWatchAgentServerPolicy, trust scoped to
# SA amazon-cloudwatch:cloudwatch-agent); on a rebuild eksctl creates the
# equivalent role from attachPolicyARNs. Enhanced Container Insights is off
# (it bills per observation); basic metrics + logs are enough here.
iam:
  withOIDC: true

addons:
  - name: amazon-cloudwatch-observability
    version: v6.7.0-eksbuild.1
    attachPolicyARNs:
      - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
    configurationValues: |-
      {"containerLogs":{"enabled":true},"agent":{"config":{"logs":{"metrics_collected":{"kubernetes":{"enhanced_container_insights":false}}}}}}
